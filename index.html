<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prathmesh ❤️ Bhakti</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
overflow:hidden;
transition:1s;
color:white;
}

/* Floating Hearts */
.heart{
position:absolute;
animation:float 8s linear infinite;
opacity:0.5;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}

.container{
width:90%;
max-width:600px;
padding:40px;
text-align:center;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(20px);
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,0.3);
transition:0.6s;
}

.hidden{
opacity:0;
pointer-events:none;
transform:translateY(20px);
}

h1{
margin-bottom:20px;
}

button{
padding:12px 28px;
border:none;
border-radius:30px;
margin:10px;
cursor:pointer;
font-weight:600;
transition:0.3s;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

button:hover{
transform:scale(1.1);
}

.refresh-btn{background:#ff2e63;color:white;}
.yes-btn{background:#ff0066;color:white;}
.no-btn{background:#ff8fa3;color:white;position:relative;}

.final{
font-size:1.5rem;
margin-top:20px;
animation:zoomIn 1.2s ease forwards;
}

@keyframes zoomIn{
from{opacity:0;transform:scale(0.7);}
to{opacity:1;transform:scale(1);}
}

/* Confetti */
.confetti{
position:fixed;
width:8px;
height:8px;
top:-10px;
animation:fall linear forwards;
}

@keyframes fall{
to{transform:translateY(100vh) rotate(360deg);}
}

</style>
</head>

<body>

<script>
for(let i=0;i<30;i++){
let heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(Math.random()*20+15)+"px";
heart.style.animationDuration=(Math.random()*5+5)+"s";
document.body.appendChild(heart);
}
</script>

<div class="container">

<div id="errorScreen">
<h1>404 - Love Not Found 💔</h1>
<p>Searching for Bhakti...</p>
<button class="refresh-btn" onclick="showValentine()">Search Again</button>
</div>

<div id="valentineScreen" class="hidden">
<h1>Bhakti, Will You Be My Valentine? 💍</h1>

<div id="buttons">
<button class="yes-btn" id="yesBtn" onclick="yesClicked()">YES ❤️</button>
<button class="no-btn" id="noBtn" onclick="noClicked()">NO 💔</button>
</div>

<div id="finalMessage" class="hidden final">
🎉 Congratulations Bhakti! 👑 <br><br>
You are the <b>Certified Queen of King Prathmesh</b> ❤️🔥
</div>

</div>
</div>

<script>

let noCount=0;

function showValentine(){
document.getElementById("errorScreen").classList.add("hidden");
setTimeout(()=>{
document.getElementById("valentineScreen").classList.remove("hidden");
},600);
}

function yesClicked(){
document.getElementById("buttons").classList.add("hidden");
document.getElementById("finalMessage").classList.remove("hidden");
launchConfetti();
}

function noClicked(){
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");

const x=Math.random()*(window.innerWidth-100);
const y=Math.random()*(window.innerHeight-50);
noBtn.style.position="fixed";
noBtn.style.left=x+"px";
noBtn.style.top=y+"px";

yesBtn.style.transform=`scale(${1+noCount*0.25})`;

const gradients=[
["#ff9a9e","#fad0c4"],
["#a18cd1","#fbc2eb"],
["#89f7fe","#66a6ff"],
["#f6d365","#fda085"]
];

const g=gradients[Math.floor(Math.random()*gradients.length)];
document.body.style.background=`linear-gradient(135deg,${g[0]},${g[1]})`;

noCount++;
}

function launchConfetti(){
const duration=5000;
const end=Date.now()+duration;

const interval=setInterval(()=>{
if(Date.now()>end){
clearInterval(interval);
return;
}

const conf=document.createElement("div");
conf.classList.add("confetti");
conf.style.left=Math.random()*window.innerWidth+"px";
conf.style.backgroundColor=`hsl(${Math.random()*360},100%,50%)`;
conf.style.animationDuration=(Math.random()*2+3)+"s";
document.body.appendChild(conf);

setTimeout(()=>conf.remove(),5000);

},100);
}

</script>

</body>
</html>
